{% extends "base.html" %}

{% block title %}403 Forbidden - Smart Attendance System{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <div class="text-danger mb-3">
                <i class="bi bi-shield-lock display-2"></i>
            </div>
            <h3 class="fw-bold text-navy">403 - Access Forbidden</h3>
            <p class="text-muted">
                You do not have the required role privileges or authorization to access this classroom or administrative resource.
            </p>
            <div class="mt-3">
                <a href="/" class="btn btn-primary bg-navy border-0">
                    &larr; Return to Home Portal
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
