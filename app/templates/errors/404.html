{% extends "base.html" %}

{% block title %}404 Not Found - Smart Attendance System{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <div class="text-warning mb-3">
                <i class="bi bi-question-circle display-2"></i>
            </div>
            <h3 class="fw-bold text-navy">404 - Page or Resource Not Found</h3>
            <p class="text-muted">
                The requested session, classroom, or verification resource could not be found or has expired.
            </p>
            <div class="mt-3">
                <a href="/" class="btn btn-primary bg-navy border-0">
                    &larr; Return to Home Portal
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
